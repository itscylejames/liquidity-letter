<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset Password — The Liquidity Letter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C;
      --gold-border: rgba(201,168,76,0.35);
      --bg: #0A0A0A;
      --border: rgba(255,255,255,0.08);
      --text: #F0EDE6;
      --muted: #8A8780;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; display: flex; align-items: center; justify-content: center; }

    .card {
      background: #111111;
      border: 1px solid var(--gold-border);
      width: 100%; max-width: 420px;
      padding: 44px 40px 40px;
      margin: 20px;
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
    .logo img { width: 36px; height: 36px; object-fit: contain; }
    .logo-text { font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text); }

    h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
    .sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }

    label { display: block; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    input {
      width: 100%; background: #1C1C1C; border: 1px solid rgba(255,255,255,0.1);
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px;
      padding: 12px 14px; outline: none; transition: border-color 0.2s; margin-bottom: 16px;
    }
    input:focus { border-color: rgba(201,168,76,0.5); }
    .btn {
      width: 100%; background: var(--gold); border: none; color: #0A0A0A;
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
      padding: 14px; cursor: pointer; letter-spacing: 0.5px; transition: opacity 0.2s;
      margin-top: 8px;
    }
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .msg { font-size: 13px; padding: 12px 16px; margin-bottom: 20px; border-radius: 2px; display: none; }
    .msg-error   { background: rgba(226,83,74,0.1); border: 1px solid rgba(226,83,74,0.3); color: #E2534A; }
    .msg-success { background: rgba(46,204,138,0.1); border: 1px solid rgba(46,204,138,0.3); color: #2ECC8A; }
    .back { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); cursor: pointer; text-decoration: none; transition: color 0.2s; }
    .back:hover { color: var(--text); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div class="card">
    <a href="index.html" class="logo">
      <img src="logo.png" alt="LL">
      <span class="logo-text">Liquidity Letter</span>
    </a>

    <div class="msg msg-error" id="msg-error"></div>
    <div class="msg msg-success" id="msg-success"></div>

    <div id="view-form">
      <h2>Set new password</h2>
      <p class="sub">Choose a new password for your account.</p>
      <label>New Password</label>
      <input type="password" id="input-password" placeholder="Minimum 6 characters" autocomplete="new-password">
      <label>Confirm Password</label>
      <input type="password" id="input-confirm" placeholder="Repeat new password" autocomplete="new-password">
      <button class="btn" id="btn-submit">Update Password</button>
    </div>

    <div id="view-done" style="display:none;text-align:center;">
      <div style="font-size:32px;margin-bottom:16px;">✓</div>
      <h2 style="margin-bottom:8px;">Password updated</h2>
      <p class="sub" style="margin-bottom:0;">You can now log in with your new password.</p>
    </div>

    <a href="index.html" class="back">← Back to home</a>
  </div>

  <script>
    var SUPABASE_URL = 'https://dumqszzkbynjeejswyki.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1bXFzenprYnluamVlanN3eWtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MDEwMjEsImV4cCI6MjA5NDM3NzAyMX0.7f_S9rVaUhlkf0F2tGZVvBBl0eIkvo0PaSXSSZIaNsg';
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function showError(msg) {
      var el = document.getElementById('msg-error');
      el.textContent = msg; el.style.display = 'block';
      document.getElementById('msg-success').style.display = 'none';
    }
    function showSuccess(msg) {
      var el = document.getElementById('msg-success');
      el.textContent = msg; el.style.display = 'block';
      document.getElementById('msg-error').style.display = 'none';
    }

    document.getElementById('btn-submit').addEventListener('click', async function() {
      var password = document.getElementById('input-password').value;
      var confirm  = document.getElementById('input-confirm').value;
      if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }
      if (password !== confirm) { showError('Passwords do not match.'); return; }

      var btn = document.getElementById('btn-submit');
      btn.textContent = 'Updating…'; btn.disabled = true;

      var { error } = await sb.auth.updateUser({ password: password });
      btn.textContent = 'Update Password'; btn.disabled = false;

      if (error) { showError(error.message); return; }

      document.getElementById('view-form').style.display = 'none';
      document.getElementById('view-done').style.display = 'block';
      document.getElementById('msg-error').style.display = 'none';
      document.getElementById('msg-success').style.display = 'none';
    });
  </script>
</body>
</html>
